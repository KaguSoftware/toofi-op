name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repo: the token is read-only for every job.
permissions:
  contents: read

jobs:
  # The lockfile is the contract: a frozen install fails if package.json and
  # pnpm-lock.yaml disagree.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # The guest QR menu site (apps/menu): a production build. Lint, typecheck and test run in
  # the jobs above through turbo. The build never calls the database (every page is dynamic).
  menu:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rop/menu build

  # Database: the local Supabase stack, migrations, and the SQL test suite.
  # `pnpm --filter @rop/db test` skips itself when the stack is down, so the
  # stack must be up here: a skip in this job is a failure to start it.
  db:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0
      - name: Start the local Supabase stack
        # Image pulls are sometimes rate limited, and a failed start leaves
        # containers holding the ports. Stop cleanly between attempts.
        run: |
          for attempt in 1 2 3; do
            pnpm db:start && exit 0
            pnpm db:stop --no-backup || true
            sleep 15
          done
          exit 1
      - name: Reset (apply every migration and the seed)
        run: pnpm db:reset
      - name: Database tests
        run: pnpm --filter @rop/db test
      # Generated types are committed. Regenerating must change nothing.
      - name: db:types is up to date
        run: |
          pnpm db:types
          git diff --exit-code
      - name: Error codes are all in ERROR_CODE_KEYS
        run: pnpm --filter @rop/db check:error-codes
      - name: Every client-callable RPC is registered
        run: pnpm --filter @rop/db check:rpc-registry

  # The desktop shell on the platform it ships to: typecheck, tests, the
  # hardening lock, and an unpacked build (renderer + shell, no installer).
  shell-windows:
    needs: install
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rop/operator-shell typecheck
      - run: pnpm --filter @rop/operator-shell test
      - run: pnpm --filter @rop/operator-shell check:electron
      - run: pnpm --filter @rop/operator-shell dist:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
