# Operator desktop installer.
#
# Trigger: push a tag like `operator-v0.2.0`. The version comes from the tag
# and nothing else: it is stamped into both package.json files on the runner
# (never committed) and into VITE_APP_VERSION.
#
# Names (product, installer, releases repo) come from brand.config.json at the
# repo root; the prepare job reads them once and every later job uses its outputs.
# Output goes to the PUBLIC releases repo named there, which is also the
# electron-updater feed. This repo gets nothing written to it, hence
# `contents: read`.
#
# Release lifecycle: `prepare` creates the DRAFT release (once, sequentially),
# the build jobs upload into it, and `publish` flips it live after every asset
# is there. electron-builder must never create the release itself: it runs one
# GitHub publisher per artifact and concurrent creates race to a 422. Publishing
# last also guarantees latest.yml never points at a missing installer.
#
# Signing is conditional on secrets (see electron-builder.config.cjs). With none
# set the build is unsigned. macOS builds only when Apple credentials exist.
name: operator-release

on:
  push:
    tags:
      - 'operator-v*'

permissions:
  contents: read
  actions: read # the gate reads the CI runs of the tagged commit

jobs:
  # An operator tag publishes an AUTO-UPDATING installer to every till. Until
  # 2026-10-01 a tag on any commit built and published, red CI or not. The tagged
  # commit must now be on main AND have a green CI run that was a push to main
  # (waiting for one still in progress). A green run from an unmerged branch,
  # or a tag on a commit that never reached main, is refused.
  gate:
    name: CI is green on the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tagged commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${SHA}" origin/main; then
            echo "::error title=Not on main::${SHA:0:8} is not an ancestor of origin/main. Merge it to main, wait for CI there, then tag."
            exit 1
          fi

      - name: Wait for a successful CI run (push to main) on this commit
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&branch=main&per_page=20"
          for _ in $(seq 1 90); do
            green=$(gh api "${api}&status=success" --jq '.total_count')
            [ "${green}" != "0" ] && { echo "CI is green on ${SHA:0:8}."; exit 0; }
            open=$(gh api "${api}" --jq '[.workflow_runs[] | select(.status != "completed")] | length')
            if [ "${open}" = "0" ]; then
              echo "::error title=No green CI::${SHA:0:8} has no successful push-to-main CI run and none in progress. Tag a commit CI passed on main."
              exit 1
            fi
            sleep 30
          done
          echo "::error title=CI still running::gave up waiting for CI on ${SHA:0:8}"
          exit 1

  prepare:
    needs: gate
    runs-on: ubuntu-latest
    # Every job that touches signing secrets or RELEASES_GH_TOKEN (prepare,
    # windows, macos, publish) runs in the `release` environment, whose required
    # reviewers gate each of them. Secrets live ONLY there (docs/RELEASING.md).
    environment: release
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      mac_enabled: ${{ steps.creds.outputs.mac_enabled }}
      win_signing: ${{ steps.creds.outputs.win_signing }}
      product_name: ${{ steps.brand.outputs.product_name }}
      installer_name: ${{ steps.brand.outputs.installer_name }}
      releases_repo: ${{ steps.brand.outputs.releases_repo }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Names from brand.config.json
        id: brand
        run: |
          {
            echo "product_name=$(node -p "require('./brand.config.json').productName")"
            echo "installer_name=$(node -p "require('./brand.config.json').installerName")"
            echo "releases_repo=$(node -p "require('./brand.config.json').releasesOwner + '/' + require('./brand.config.json').releasesRepo")"
          } >> "$GITHUB_OUTPUT"

      - name: Version from the tag
        id: ver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#operator-v}"
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not operator-v<semver> (e.g. operator-v0.2.0)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Job-level `if:` cannot read secrets; a step can, and reports what the
      # build is going to be able to do before anything is built.
      - name: Which credentials exist
        id: creds
        env:
          OPERATOR_SUPABASE_URL: ${{ secrets.OPERATOR_SUPABASE_URL }}
          OPERATOR_SUPABASE_ANON_KEY: ${{ secrets.OPERATOR_SUPABASE_ANON_KEY }}
          RELEASES_REPO: ${{ steps.brand.outputs.releases_repo }}
          RELEASES_GH_TOKEN: ${{ secrets.RELEASES_GH_TOKEN }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_ESIGNER_USERNAME: ${{ secrets.WIN_ESIGNER_USERNAME }}
          WIN_ESIGNER_PASSWORD: ${{ secrets.WIN_ESIGNER_PASSWORD }}
          WIN_ESIGNER_CREDENTIAL_ID: ${{ secrets.WIN_ESIGNER_CREDENTIAL_ID }}
          WIN_ESIGNER_TOTP_SECRET: ${{ secrets.WIN_ESIGNER_TOTP_SECRET }}
          WIN_SIGN_PUBLISHER_NAME: ${{ vars.WIN_SIGN_PUBLISHER_NAME }}
          WIN_SIGN_DRY_RUN: ${{ vars.WIN_SIGN_DRY_RUN }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$OPERATOR_SUPABASE_URL" ] || [ -z "$OPERATOR_SUPABASE_ANON_KEY" ]; then
            echo "::error::OPERATOR_SUPABASE_URL / OPERATOR_SUPABASE_ANON_KEY are missing — the renderer would crash at startup by design"
            exit 1
          fi
          if [ -z "$RELEASES_GH_TOKEN" ]; then
            echo "::error::RELEASES_GH_TOKEN is missing — nothing could be published to $RELEASES_REPO"
            exit 1
          fi
          win=unsigned
          [ -n "$WIN_CSC_LINK" ] && win=pfx
          if [ -n "$WIN_ESIGNER_USERNAME" ] && [ -n "$WIN_ESIGNER_PASSWORD" ] && [ -n "$WIN_ESIGNER_CREDENTIAL_ID" ] && [ -n "$WIN_ESIGNER_TOTP_SECRET" ]; then
            win=esigner
          fi
          [ -n "$AZURE_CLIENT_ID" ] && win=azure
          # Releases are refused unless signed. Without a signature and a publisher
          # name, electron-updater skips signature checks on every station, and an
          # unsigned release after a signed one is refused by every updater.
          # Only a WIN_SIGN_DRY_RUN=1 run (counts signings) may go without.
          if [ "$WIN_SIGN_DRY_RUN" != "1" ]; then
            if [ "$win" = "unsigned" ]; then
              echo "::error::No Windows signing credentials (AZURE_*, WIN_ESIGNER_* or WIN_CSC_LINK). Unsigned releases are refused."
              exit 1
            fi
            if [ -z "$WIN_SIGN_PUBLISHER_NAME" ]; then
              echo "::error::WIN_SIGN_PUBLISHER_NAME is unset, so installed apps would not verify update signatures. Set it in the release environment."
              exit 1
            fi
          fi
          mac=false
          if [ -n "$MAC_CSC_LINK" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            mac=true
          fi
          echo "win_signing=$win" >> "$GITHUB_OUTPUT"
          echo "mac_enabled=$mac" >> "$GITHUB_OUTPUT"
          echo "::notice::windows signing: $win — macOS build: $mac"

      # The one place the release is created (see the header). Idempotent: a
      # re-run finds the existing draft. Re-cutting an already PUBLISHED version
      # still needs the release + tag deleted in the public repo first.
      - name: Create the draft release in the public repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_GH_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          RELEASES_REPO: ${{ steps.brand.outputs.releases_repo }}
          PRODUCT_NAME: ${{ steps.brand.outputs.product_name }}
        run: |
          if gh release view "v$VERSION" -R "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "release v$VERSION already exists — reusing it"
          else
            gh release create "v$VERSION" -R "$RELEASES_REPO" --draft \
              --title "$VERSION" --target main \
              --notes "$PRODUCT_NAME $VERSION"
          fi

  windows:
    needs: prepare
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      # Fail before any build if this is not a signed release. The config
      # repeats the check (REQUIRE_SIGNED) so the two cannot drift apart.
      - name: Refuse an unsigned release
        shell: bash
        env:
          WIN_SIGNING: ${{ needs.prepare.outputs.win_signing }}
          WIN_SIGN_PUBLISHER_NAME: ${{ vars.WIN_SIGN_PUBLISHER_NAME }}
          WIN_SIGN_DRY_RUN: ${{ vars.WIN_SIGN_DRY_RUN }}
        run: |
          if [ "$WIN_SIGN_DRY_RUN" != "1" ] && { [ "$WIN_SIGNING" = "unsigned" ] || [ -z "$WIN_SIGN_PUBLISHER_NAME" ]; }; then
            echo "::error::Refusing an unsigned Windows release (signing=$WIN_SIGNING, publisher name set: ${WIN_SIGN_PUBLISHER_NAME:+yes})."
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # No `version:` here — the root package.json's `packageManager` pins pnpm,
      # and giving both makes action-setup fail with "Multiple versions of pnpm
      # specified" (first release run, 2026-09-07). Same shape as ci.yml.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Stamp the version from the tag (not committed)
        shell: bash
        run: |
          (cd apps/operator-shell && npm pkg set version="$VERSION")
          (cd apps/operator && npm pkg set version="$VERSION")

      - name: Build renderer (hosted env baked in)
        env:
          VITE_SUPABASE_URL: ${{ secrets.OPERATOR_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.OPERATOR_SUPABASE_ANON_KEY }}
          VITE_APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: pnpm --filter @rop/operator build

      # SUPABASE_URL is baked into the shell's CSP connect-src (esbuild.config.mjs).
      - name: Bundle main + preload
        env:
          SUPABASE_URL: ${{ secrets.OPERATOR_SUPABASE_URL }}
        run: pnpm --filter @rop/operator-shell build

      # eSigner route only. The Windows zip carries its own JDK, so no setup-java.
      # Pinned by version and sha256 (the release has no checksum file of its own;
      # hash taken from the v1.3.1 zip on 2026-10-17). Bump both together.
      - name: Fetch SSL.com CodeSignTool (eSigner route)
        if: needs.prepare.outputs.win_signing == 'esigner'
        shell: pwsh
        run: |
          $url = 'https://www.ssl.com/wp-content/uploads/2024/10/CodeSignTool-v1.3.1-windows.zip'
          $sha = 'e45a9e6c2aac4cae16c114eb590a2196406681357eb587507c65cd3646b5330d'
          $zip = Join-Path $env:RUNNER_TEMP 'codesigntool.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'codesigntool'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $got = (Get-FileHash -Algorithm SHA256 $zip).Hash
          if ($got -ne $sha) { Write-Output "::error::CodeSignTool zip sha256 mismatch ($got)"; exit 1 }
          Expand-Archive -Path $zip -DestinationPath $dir
          # The zip has no top-level folder: jdk-*/ and jar/ land directly in $dir.
          "CODESIGNTOOL_PATH=$dir" >> $env:GITHUB_ENV

      - name: Build the installer, sign if credentials exist, publish
        working-directory: apps/operator-shell
        env:
          GH_TOKEN: ${{ secrets.RELEASES_GH_TOKEN }}
          # A re-run, or the mac job, may land more than two hours after the
          # release was created; without this electron-publish skips the upload.
          EP_GH_IGNORE_TIME: 'true'
          # Route a — Azure Trusted Signing. All six present → the config adds
          # win.azureSignOptions; electron-builder installs the TrustedSigning
          # PowerShell module itself.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ vars.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          WIN_SIGN_PUBLISHER_NAME: ${{ vars.WIN_SIGN_PUBLISHER_NAME }}
          WIN_SIGN_DRY_RUN: ${{ vars.WIN_SIGN_DRY_RUN }}
          # electron-builder.config.cjs throws if the build would be unsigned.
          REQUIRE_SIGNED: ${{ vars.WIN_SIGN_DRY_RUN == '1' && '0' || '1' }}
          # Route b — SSL.com eSigner (cloud OV certificate). All four present →
          # the config adds win.signtoolOptions.sign (scripts/sign-win.cjs), which
          # runs the CodeSignTool fetched above (CODESIGNTOOL_PATH).
          WIN_ESIGNER_USERNAME: ${{ secrets.WIN_ESIGNER_USERNAME }}
          WIN_ESIGNER_PASSWORD: ${{ secrets.WIN_ESIGNER_PASSWORD }}
          WIN_ESIGNER_CREDENTIAL_ID: ${{ secrets.WIN_ESIGNER_CREDENTIAL_ID }}
          WIN_ESIGNER_TOTP_SECRET: ${{ secrets.WIN_ESIGNER_TOTP_SECRET }}
          # Route c — a PFX. An empty value is "unsigned" to electron-builder.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm exec electron-builder --win --config electron-builder.config.cjs --publish always

      # Belt and braces: a route that resolved to signed must have produced signed
      # files, or the job fails (and `publish` needs this job, so the draft stays
      # a draft). The upload already happened inside the build step.
      - name: Prove the Windows build is signed
        if: needs.prepare.outputs.win_signing != 'unsigned'
        shell: pwsh
        working-directory: apps/operator-shell/release
        env:
          WIN_SIGN_PUBLISHER_NAME: ${{ vars.WIN_SIGN_PUBLISHER_NAME }}
          PRODUCT_NAME: ${{ needs.prepare.outputs.product_name }}
          INSTALLER_NAME: ${{ needs.prepare.outputs.installer_name }}
        run: |
          $bad = $false
          $files = @("$env:INSTALLER_NAME.exe", "win-unpacked/$env:PRODUCT_NAME.exe")
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature -LiteralPath $f
            if (($s.Status -in 'NotSigned', 'HashMismatch') -or $null -eq $s.SignerCertificate) {
              Write-Output "::error::$f is not signed (status $($s.Status))"
              $bad = $true
            } else {
              Write-Output "$f : $($s.Status) by $($s.SignerCertificate.Subject)"
            }
          }
          if ($env:WIN_SIGN_PUBLISHER_NAME -and -not (Select-String -Path 'win-unpacked/resources/app-update.yml' -Pattern 'publisherName' -Quiet)) {
            Write-Output '::error::app-update.yml has no publisherName'
            $bad = $true
          }
          if ($bad) { exit 1 }

      # A debugging copy. The public release is the real output.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operator-windows-${{ env.VERSION }}
          path: |
            apps/operator-shell/release/*.exe
            apps/operator-shell/release/*.yml
            apps/operator-shell/release/*.blockmap
          retention-days: 14

  macos:
    needs: prepare
    if: needs.prepare.outputs.mac_enabled == 'true'
    # arm64 host; ships BOTH arm64 (Apple silicon) and x64 (Intel) dmg + zip.
    runs-on: macos-latest
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # No `version:` here — the root package.json's `packageManager` pins pnpm,
      # and giving both makes action-setup fail with "Multiple versions of pnpm
      # specified" (first release run, 2026-09-07). Same shape as ci.yml.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Stamp the version from the tag (not committed)
        run: |
          (cd apps/operator-shell && npm pkg set version="$VERSION")
          (cd apps/operator && npm pkg set version="$VERSION")

      - name: Build renderer (hosted env baked in)
        env:
          VITE_SUPABASE_URL: ${{ secrets.OPERATOR_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.OPERATOR_SUPABASE_ANON_KEY }}
          VITE_APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: pnpm --filter @rop/operator build

      # SUPABASE_URL is baked into the shell's CSP connect-src (esbuild.config.mjs).
      - name: Bundle main + preload
        env:
          SUPABASE_URL: ${{ secrets.OPERATOR_SUPABASE_URL }}
        run: pnpm --filter @rop/operator-shell build

      # electron-builder 26.15–26.16 imports CSC_LINK into a temp keychain and
      # then runs `security set-key-partition-list` with the .p12 password where
      # the keychain's own password is required, so SecKeychainUnlock fails every
      # time (electron-builder #10066; fixed upstream 2026-08-24, not in any
      # published v26 as of 2026-09-07 — the first mac run died on it). So the
      # keychain is ours: import here the way Apple's tooling does, then hand
      # electron-builder the keychain + identity (CSC_KEYCHAIN / CSC_NAME) and
      # never CSC_LINK. Drop this step once a release ships the fix.
      - name: Import the Developer ID certificate into a keychain
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pw="$(openssl rand -base64 32)"
          p12="$RUNNER_TEMP/devid.p12"
          printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security import "$p12" -k "$keychain" -P "$MAC_CSC_KEY_PASSWORD" -f pkcs12             -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pw" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$p12"
          security find-identity -v -p codesigning "$keychain"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build dmg + zip for arm64 and x64, sign, notarize, publish
        working-directory: apps/operator-shell
        env:
          GH_TOKEN: ${{ secrets.RELEASES_GH_TOKEN }}
          EP_GH_IGNORE_TIME: 'true'
          # The keychain from the import step; CSC_NAME selects the identity by
          # the team id in its name ("Developer ID Application: … (TEAMID)").
          CSC_KEYCHAIN: ${{ env.CSC_KEYCHAIN }}
          CSC_NAME: ${{ secrets.APPLE_TEAM_ID }}
          # Notarization is scripts/notarize-mac.cjs (afterSign): submits and does
          # not wait. NOTARIZE_WAIT=1 here makes it poll Apple and staple.
          # Notarization (electron-builder's `notarize: true` reads these).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec electron-builder --mac --config electron-builder.config.cjs --publish always

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operator-macos-${{ env.VERSION }}
          path: |
            apps/operator-shell/release/*.dmg
            apps/operator-shell/release/*.zip
            apps/operator-shell/release/*.yml
            apps/operator-shell/release/*.blockmap
          retention-days: 14

  # Flip the draft live only once every platform that was going to upload has
  # uploaded. Until this runs, `releases/latest` and the updater feed still
  # serve the previous version — a half-uploaded release is never visible.
  publish:
    needs: [prepare, windows, macos]
    if: >-
      always()
      && needs.prepare.result == 'success'
      && needs.windows.result == 'success'
      && (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read

    env:
      GH_TOKEN: ${{ secrets.RELEASES_GH_TOKEN }}
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASES_REPO: ${{ needs.prepare.outputs.releases_repo }}
    steps:
      # The mac list is checked only when the mac job ran: both arches, since
      # the download page links the arm64 and the x64 dmg by name and the
      # updater feed (latest-mac.yml) names both zips.
      - name: Assert the assets are all there
        env:
          MAC_BUILT: ${{ needs.macos.result == 'success' }}
          INSTALLER_NAME: ${{ needs.prepare.outputs.installer_name }}
        run: |
          assets=$(gh release view "v$VERSION" -R "$RELEASES_REPO" --json assets -q '.assets[].name')
          echo "$assets"
          need="$INSTALLER_NAME.exe $INSTALLER_NAME.exe.blockmap latest.yml"
          if [ "$MAC_BUILT" = "true" ]; then
            need="$need latest-mac.yml"
            for arch in arm64 x64; do
              base="${INSTALLER_NAME%-Setup}"
              need="$need $base-$arch.dmg $base-$arch.zip $base-$arch.zip.blockmap"
            done
          fi
          for f in $need; do
            if ! grep -qx "$f" <<<"$assets"; then
              echo "::error::$f is missing from release v$VERSION — not publishing"
              exit 1
            fi
          done
      - name: Publish the release
        run: gh release edit "v$VERSION" -R "$RELEASES_REPO" --draft=false --latest
