# Local Supabase stack for the restaurant operator.
#
# Every host port is moved off the CLI defaults (543xx) so this stack can run
# beside TouchPadel's local stack on the same machine.
project_id = "rop"

[api]
enabled = true
port = 55421
schemas = ["public", "app"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55422
shadow_port = 55420
major_version = 17

[db.pooler]
enabled = false
port = 55429

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 55423
api_url = "http://127.0.0.1"

[local_smtp]  # was [inbucket]; the mail catcher web UI
enabled = true
port = 55424

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Staff accounts are created by the owner (staff admin), never by sign-up.
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = false

[analytics]
enabled = false
port = 55427

[edge_runtime]
enabled = true
